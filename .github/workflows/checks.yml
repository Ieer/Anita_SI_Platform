name: Delivery Checks

on:
  push:
  pull_request:
  workflow_dispatch:
  schedule:
    - cron: '37 2 * * 1'

permissions:
  contents: read

concurrency:
  group: checks-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  regression:
    runs-on: windows-latest
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.lock'
      - name: Install Locked Development Environment
        run: python -m pip install --require-hashes -r requirements_dev.lock
      - name: Isolated Static Checks and Regression
        run: python scripts/check_ci.py
      - name: Install Chromium
        run: python -m playwright install --only-shell chromium
      - name: Isolated Browser Smoke Tests
        run: python scripts/check_ci.py --browser-smoke
      - name: Upload Test Reports
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: windows-python311-tests
          path: |
            cache/report/ci/
            cache/report/ui/
          if-no-files-found: ignore
          retention-days: 14

  dependency-audit:
    runs-on: windows-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          persist-credentials: false
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: pip
          cache-dependency-path: 'requirements*.lock'
      - name: Install Locked Audit Tools
        run: python -m pip install --require-hashes -r requirements_dev.lock
      - name: Audit Runtime Lock
        run: |
          New-Item -ItemType Directory -Force cache/report/ci | Out-Null
          python -m pip_audit -r requirements_win.lock --no-deps --disable-pip --strict --require-hashes --progress-spinner off --format json --output cache/report/ci/dependencies.json
      - name: Upload Dependency Audit
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: runtime-dependency-audit
          path: cache/report/ci/dependencies.json
          if-no-files-found: ignore
          retention-days: 14